<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Log | ZTG Heavy Parts</title>
    <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <div class="sidebar"></div>

        <!-- Main Workspace -->
        <div class="main-workspace">
            <div class="top-bar">
                <div class="top-bar-title">Sales Log</div>
                <div class="top-bar-actions">
                    <span class="page-description">Revenue-impacting transactions from your sessions. Completed and refunded sales only.</span>
                </div>
            </div>

            <div class="content-body">
                <!-- Stat Cards Row -->
                <div class="grid-3" style="grid-template-columns: 1fr; margin-bottom: 24px;">
                    <div class="card stat-box">
                        <div>
                            <span class="stat-label">Gross Sales Revenue</span>
                            <div class="stat-value" id="cashierGrossSales">₱0</div>
                        </div>
                    </div>
                </div>

                <!-- Filters -->
                <div class="card" style="margin-bottom: 24px;">
                    <div class="table-filters" style="display: flex; gap: 12px; flex-wrap: wrap; align-items: center;">
                        <div style="flex: 1; min-width: 250px; position: relative;">
                            <input type="text" id="salesSearch" class="form-control form-control-sm" placeholder="Search customer, item, SI..." oninput="renderMySales()" style="height: 38px; padding: 8px 12px; font-size: 13px; border: 1px solid var(--border); border-radius: 6px; background-color: var(--bg-card); color: var(--text-primary); width: 100%;">
                        </div>
                        <div style="width: 150px;">
                            <select id="timeFilter" class="form-control form-control-sm" onchange="renderMySales()" style="height: 38px; padding: 8px 12px; font-size: 13px; border: 1px solid var(--border); border-radius: 6px; background-color: var(--bg-card); color: var(--text-primary); width: 100%;">
                                <option value="Today" selected>Today</option>
                                <option value="All">All Time</option>
                                <option value="This Week">This Week</option>
                                <option value="This Month">This Month</option>
                            </select>
                        </div>
                        <div style="width: 150px;">
                            <select id="cashierFilter" class="form-control form-control-sm" onchange="renderMySales()" style="height: 38px; padding: 8px 12px; font-size: 13px; border: 1px solid var(--border); border-radius: 6px; background-color: var(--bg-card); color: var(--text-primary); width: 100%;">
                                <option value="All">All Cashiers</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- My Sales Ledger Table -->
                <div class="card table-card">
                    <div class="table-header-bar">
                        <h3 style="font-size: 16px; font-weight: 700;">Fulfilled Sales Invoices</h3>
                    </div>
                    <div style="overflow-x: auto;">
                        <table>
                            <thead style="border-bottom: 1px solid var(--border); font-size: 11px; color: var(--text-secondary); text-transform: uppercase;">
                                <tr>
                                    <th style="padding: 12px 16px; font-weight: 700;">DATE</th>
                                    <th style="padding: 12px 16px; font-weight: 700;">S.I./C.I./D.R.</th>
                                    <th style="padding: 12px 16px; font-weight: 700;">PART NO.</th>
                                    <th style="padding: 12px 16px; font-weight: 700;">PRODUCT</th>
                                    <th style="padding: 12px 16px; font-weight: 700;">QTY</th>
                                    <th style="padding: 12px 16px; font-weight: 700;">AMOUNT</th>
                                    <th style="padding: 12px 16px; font-weight: 700;">CUSTOMER</th>
                                    <th style="padding: 12px 16px; font-weight: 700;">PAYMENT</th>
                                    <th style="padding: 12px 16px; font-weight: 700;">SERVED BY</th>
                                    <th style="padding: 12px 16px; font-weight: 700;">STATUS</th>
                                </tr>
                            </thead>
                            <tbody id="mySalesTableBody">
                                <!-- Populated dynamically -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        initSidebar('daily-sales');

        function loadCashiers() {
            const user = getCurrentUser();
            const employees = db.getEmployees() || [];
            const filterDropdown = document.getElementById('cashierFilter');
            filterDropdown.innerHTML = '<option value="All">All Cashiers</option>';
            
            employees.filter(e => e.role !== 'Admin').forEach(e => {
                const selected = e.name.toLowerCase() === user.name.toLowerCase() ? 'selected' : '';
                filterDropdown.innerHTML += `<option value="${e.name}" ${selected}>${e.name}</option>`;
            });
        }

        loadCashiers();

        // Parse date string to a Date object for comparison
        function parseTxDate(dateStr) {
            if (!dateStr) return null;
            // Handle ISO format
            if (dateStr.includes('T') || dateStr.match(/^\d{4}-/)) {
                return new Date(dateStr);
            }
            // Handle "Jun 21, 2026, 3:14 PM" format
            try {
                return new Date(Date.parse(dateStr));
            } catch (e) {
                return null;
            }
        }

        function matchesTimeFilter(t, filterVal) {
            if (filterVal === 'All') return true;
            const txDate = parseTxDate(t.date);
            if (!txDate || isNaN(txDate)) return true; // Can't parse, show it

            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

            if (filterVal === 'Today') {
                const txDay = new Date(txDate.getFullYear(), txDate.getMonth(), txDate.getDate());
                return txDay.getTime() === today.getTime();
            }
            if (filterVal === 'This Week') {
                const dayOfWeek = today.getDay(); // 0=Sun
                const weekStart = new Date(today);
                weekStart.setDate(today.getDate() - dayOfWeek);
                return txDate >= weekStart;
            }
            if (filterVal === 'This Month') {
                return txDate.getFullYear() === now.getFullYear() && txDate.getMonth() === now.getMonth();
            }
            return true;
        }

        function renderMySales() {
            const user = getCurrentUser();
            const transactions = db.getTransactions();
            const tbody = document.getElementById('mySalesTableBody');
            
            const searchVal = document.getElementById('salesSearch').value.toLowerCase();
            const cashierVal = document.getElementById('cashierFilter').value;
            const timeVal = document.getElementById('timeFilter').value;

            tbody.innerHTML = '';

            // Filter Completed or PO Approved sales
            const filteredSales = transactions.filter(t => {
                const isCorrectStatus = (t.status === 'Completed' || t.status === 'P.O. Approved');
                if (!isCorrectStatus) return false;

                const matchesCashier = (cashierVal === 'All' || t.cashier.toLowerCase() === cashierVal.toLowerCase());
                const matchesTime = matchesTimeFilter(t, timeVal);
                const matchesSearch = !searchVal || 
                    (t.siNo || '').toLowerCase().includes(searchVal) ||
                    (t.customer || '').toLowerCase().includes(searchVal) ||
                    (t.cashier || '').toLowerCase().includes(searchVal) ||
                    (t.itemName || '').toLowerCase().includes(searchVal);

                return matchesCashier && matchesTime && matchesSearch;
            });

            const products = db.getProducts();

            let gross = 0;

            filteredSales.forEach(t => {
                gross += t.amount;

                let rowItems = [];
                if (t.items && t.items.length > 0) {
                    rowItems = t.items;
                } else {
                    rowItems = [{
                        id: null,
                        name: t.itemName,
                        partNo: 'N/A',
                        qty: t.qty,
                        price: null
                    }];
                }

                rowItems.forEach(item => {
                    // Resolve Part Number and Product details
                    let partNo = item.partNo || '';
                    let product = null;

                    if (item.id) {
                        product = products.find(p => p.id === item.id);
                    }
                    
                    if (!partNo || partNo === 'N/A' || partNo === '—') {
                        let baseName = item.name || t.itemName || '';
                        if (baseName.includes(' & ')) {
                            baseName = baseName.split(' & ')[0];
                        }
                        baseName = baseName.replace(' (Order Release)', '').trim();
                        
                        product = products.find(p => p.name === baseName);
                        
                        if (!product && baseName.includes(' (')) {
                            const noVariantName = baseName.split(' (')[0].trim();
                            product = products.find(p => p.name === noVariantName);
                        }
                        
                        if (!product) {
                            const sortedProducts = [...products].sort((a, b) => b.name.length - a.name.length);
                            product = sortedProducts.find(p => baseName.startsWith(p.name));
                        }
                        
                        partNo = (product && product.partNo) ? product.partNo : 'N/A';
                    }

                    if (!product) {
                        product = {};
                    }
                    const chineseName = product.chineseName || '';
                    
                    let resolvedName = item.name || t.itemName || '-';
                    if (item.variant) {
                        if (!resolvedName.includes(`(${item.variant})`)) {
                            resolvedName += ` (${item.variant})`;
                        }
                    }
                    
                    let displayName = `<span style="font-weight: 600; color: var(--text-primary);">${resolvedName}</span>`;
                    if (chineseName) {
                        displayName += `<br><span style="font-size: 12px; color: var(--text-secondary);">${chineseName}</span>`;
                    }

                    // Format payment method to include details if present
                    let paymentDisplay = t.payment;
                    if (t.payment.includes('Deposit')) {
                        paymentDisplay = `<span style="color: var(--text-secondary);">${t.payment}</span>`;
                    }

                    // Calculate row amount
                    let rowAmount = 0;
                    if (item.price !== null && item.price !== undefined) {
                        rowAmount = item.price * item.qty;
                    } else {
                        rowAmount = t.amount || 0;
                    }

                    const tr = document.createElement('tr');
                    tr.style.borderBottom = "1px solid var(--border)";
                    tr.innerHTML = `
                        <td style="padding: 16px; font-size: 13px;">${t.date.replace(', ', '<br>')}</td>
                        <td style="padding: 16px; font-size: 14px; font-weight: 700; color: var(--text-primary);">${t.siNo}</td>
                        <td style="padding: 16px; font-size: 13px; color: var(--text-secondary);">${partNo}</td>
                        <td style="padding: 16px;">${displayName}</td>
                        <td style="padding: 16px; font-size: 13px; color: var(--text-secondary);">${item.qty}</td>
                        <td style="padding: 16px; font-size: 14px; font-weight: 700;">₱${rowAmount.toLocaleString(undefined, {minimumFractionDigits: 0})}</td>
                        <td style="padding: 16px; font-size: 13px; color: var(--text-secondary);">${t.customer || 'Guest'}</td>
                        <td style="padding: 16px; font-size: 13px; color: var(--text-secondary);">${paymentDisplay}</td>
                        <td style="padding: 16px; font-size: 13px; color: var(--text-secondary);">${t.cashier}</td>
                        <td style="padding: 16px;"><span style="color: var(--success); font-size: 13px; font-weight: 600;">Completed</span></td>
                    `;
                    tbody.appendChild(tr);
                });
            });

            document.getElementById('cashierGrossSales').innerText = `₱${gross.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;

            if (filteredSales.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" style="text-align: center; color: var(--text-secondary); padding: 24px 0;">No completed transactions found for the selected filters.</td></tr>';
            }
        }

        renderMySales();
    </script>
</body>
</html>
