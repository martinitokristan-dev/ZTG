<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management | ZTG Heavy Parts</title>
    <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <div class="sidebar"></div>

        <!-- Main Workspace -->
        <div class="main-workspace">
            <div class="top-bar">
                <div>
                    <h1 style="font-size: 20px; margin-bottom: 2px;">Inventory Management</h1>
                    <div class="page-description" id="inventoryHeaderStats" style="margin-top: 0; font-size: 12px; color: var(--text-secondary);">
                        Loading inventory summary...
                    </div>
                </div>
                <div class="top-bar-actions">
                    <span class="badge badge-success" style="font-size: 11px; padding: 6px 12px;">Read-Only View</span>
                </div>
            </div>

            <div class="content-body">
                <!-- Filters -->
                <div class="card" style="margin-bottom: 16px;">
                    <div class="table-filters" style="display: flex; gap: 12px; flex-wrap: wrap;">
                        <div style="flex: 1; min-width: 200px; position: relative;">
                            <svg style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--text-muted);" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                            </svg>
                            <input type="text" id="searchBar" class="form-control form-control-sm" placeholder="Search product description, part number, category, or address..." style="padding-left: 44px;" oninput="renderInventoryTable()">
                        </div>
                        <div style="width: 180px;">
                            <select id="categoryFilter" class="form-control form-control-sm" onchange="renderInventoryTable()">
                                <option value="All">All Categories</option>
                            </select>
                        </div>
                        <div style="width: 180px;">
                            <select id="stockFilter" class="form-control form-control-sm" onchange="renderInventoryTable()">
                                <option value="All">All Stock Levels</option>
                                <option value="Active">Active / Healthy</option>
                                <option value="Low">Low Stock</option>
                                <option value="No">No Stock</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Catalog Table Card -->
                <div class="card table-card">
                    <div style="overflow-x: auto;">
                        <table>
                            <thead>
                                <tr>
                                    <th>Product</th>
                                    <th>Part No.</th>
                                    <th>Category</th>
                                    <th>Address</th>
                                    <th>Stock</th>
                                    <th>Original Price</th>
                                    <th>Retail Price</th>
                                    <th>Sales</th>
                                    <th>Status</th>
                                    <th>Damaged</th>
                                    <th style="text-align: center;">View</th>
                                </tr>
                            </thead>
                            <tbody id="inventoryTableBody">
                                <!-- Populated dynamically -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: VIEW DETAILS -->
    <div class="modal-overlay" id="viewItemModal">
        <div class="modal-card" style="max-width: 850px; width: 95%;">
            <div class="modal-header">
                <h3 class="modal-title" id="viewTitle">Product Details</h3>
                <button type="button" class="modal-close" onclick="closeModal('viewItemModal')">
                    <svg viewBox="0 0 24 24" style="width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2;"><path d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="modal-body" id="viewItemModalBody">
                <!-- Populated dynamically -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal('viewItemModal')">Close</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        initSidebar('inventory');

        // Populate Category Dropdowns & Filter options
        function loadCategories() {
            const categories = db.getCategories();
            const filterDropdown = document.getElementById('categoryFilter');

            filterDropdown.innerHTML = '<option value="All">All Categories</option>';
            categories.forEach(cat => {
                filterDropdown.innerHTML += `<option value="${cat}">${cat}</option>`;
            });
        }

        // Calculate and render stats dynamically in header subtext
        function updateHeaderSummary(products) {
            const totalCount = products.length;
            const categoriesCount = db.getCategories().length;
            
            const lowStockCount = products.filter(p => p.stock > 0 && p.stock <= (p.alertLimit || 5)).length;
            const noStockCount = products.filter(p => p.stock === 0).length;

            document.getElementById('inventoryHeaderStats').innerText = 
                `${totalCount} total items across ${categoriesCount} categories · ${noStockCount} out of stock · ${lowStockCount} low stock`;
        }

        // Render inventory table
        function renderInventoryTable() {
            const products = db.getProducts();
            updateHeaderSummary(products);

            const searchVal = document.getElementById('searchBar').value.toLowerCase();
            const categoryVal = document.getElementById('categoryFilter').value;
            const stockVal = document.getElementById('stockFilter').value;
            const tbody = document.getElementById('inventoryTableBody');

            tbody.innerHTML = '';

            const filtered = products.filter(p => {
                const matchesSearch = p.name.toLowerCase().includes(searchVal) || 
                                      (p.chineseName || '').toLowerCase().includes(searchVal) || 
                                      p.partNo.toLowerCase().includes(searchVal) ||
                                      (p.address || '').toLowerCase().includes(searchVal);

                const matchesCategory = categoryVal === 'All' || p.category === categoryVal;
                
                let matchesStock = true;
                if (stockVal === 'Low') matchesStock = p.stock > 0 && p.stock <= (p.alertLimit || 5);
                else if (stockVal === 'No') matchesStock = p.stock === 0;
                else if (stockVal === 'Active') matchesStock = p.stock > (p.alertLimit || 5);

                return matchesSearch && matchesCategory && matchesStock;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="11" style="text-align: center; color: var(--text-secondary); padding: 20px;">No inventory items found.</td></tr>';
                return;
            }

            // Group by name, base first then variants
            const groups = {};
            const groupOrder = [];
            filtered.forEach(p => {
                const key = p.name.toLowerCase();
                if (!groups[key]) { groups[key] = []; groupOrder.push(key); }
                groups[key].push(p);
            });
            groupOrder.forEach(key => {
                groups[key].sort((a, b) => (!a.variantOptions ? -1 : !b.variantOptions ? 1 : 0));
            });

            groupOrder.forEach((key, groupIdx) => {
                const group = groups[key];
                group.forEach((p, i) => {
                    const isVariant = !!p.variantOptions;
                    const isFirstInGroup = i === 0 && groupIdx > 0;

                    const tr = document.createElement('tr');
                    if (isFirstInGroup) tr.style.borderTop = '2px solid #E2E8F0';

                    const alertLevel = p.alertLimit || 5;
                    const isOutOfStock = p.stock === 0;
                    const isLowStock = p.stock > 0 && p.stock <= alertLevel;

                    let stockStatusText = 'Active';
                    let stockStatusClass = 'badge-success';
                    if (isOutOfStock) { stockStatusText = 'No Stock'; stockStatusClass = 'badge-danger'; }
                    else if (isLowStock) { stockStatusText = 'Low Stock'; stockStatusClass = 'badge-warning'; }

                    let nameHtml;
                    if (isVariant) {
                        nameHtml = `<strong style="color: var(--text-primary); font-size: 13px; display: block;">${p.name} <span style="color:var(--primary); font-weight: 500;">(${p.variantOptions})</span></strong>
                            <span class="chinese-subtitle" style="font-size: 11px; color: var(--text-secondary); margin-top: 2px;">${p.chineseName || ''}</span>`;
                    } else {
                        nameHtml = `<strong style="color: var(--text-primary); font-size: 13px; display: block;">${p.name}</strong>
                            <span class="chinese-subtitle" style="font-size: 11px; color: var(--text-secondary); margin-top: 2px;">${p.chineseName || ''}</span>`;
                    }

                    tr.innerHTML = `
                        <td>${nameHtml}</td>
                        <td class="font-bold" style="font-size:12px;font-family:monospace;">${p.partNo}</td>
                        <td>${p.category}</td>
                        <td><code>${p.address}</code></td>
                        <td>
                            <span class="badge ${stockStatusClass}" style="display: inline-flex; flex-direction: column; align-items: center; line-height: 1.2; padding: 4px 8px; min-width: 50px; border-radius: 6px;">
                                <span style="font-size: 13px; font-weight: 700;">${p.stock}</span>
                                <span style="font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px;">Units</span>
                            </span>
                        </td>
                        <td class="font-bold">₱${(p.price1||0).toLocaleString()}</td>
                        <td class="font-bold" style="color: var(--primary);">₱${(p.price2||0).toLocaleString()}</td>
                        <td>${p.salesCount || 0} sold</td>
                        <td>
                            <span class="badge ${stockStatusClass}">${stockStatusText}</span>
                        </td>
                        <td>
                            <span class="badge badge-secondary" style="background-color: var(--danger-light); color: var(--danger); display: inline-flex; flex-direction: column; align-items: center; line-height: 1.2; padding: 4px 8px; min-width: 60px; border-radius: 6px;">
                                <span style="font-size: 13px; font-weight: 700;">${p.damaged || 0}</span>
                                <span style="font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px;">Damaged</span>
                            </span>
                        </td>
                        <td style="text-align: center;">
                            <button class="btn btn-secondary btn-sm" style="padding: 4px;" onclick="viewItem(${p.id})">
                                <svg viewBox="0 0 24 24" style="width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2;"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            });
        }

        // View single product details (shows base product info + associated variants)
        function viewItem(id) {
            const products = db.getProducts();
            const p = products.find(x => x.id === id);
            if (!p) return;

            // Resolve to base product
            const allSameName = products.filter(x => x.name.toLowerCase() === p.name.toLowerCase());
            const base = allSameName.find(x => !x.variantOptions) || p;
            const variantProducts = allSameName.filter(x => !!x.variantOptions);

            document.getElementById('viewTitle').innerText = `Product Specs: ${base.name}`;

            // Build variant rows
            let variantsHtml = '';
            if (variantProducts.length > 0) {
                variantsHtml = `
                    <div style="margin-top: 16px;">
                        <h4 style="font-weight: 700; margin-bottom: 10px; color: var(--primary); font-size: 13px; letter-spacing: 0.3px;">
                            Associated SKUs &amp; Variants (${variantProducts.length})
                        </h4>
                        <table style="width: 100%; border-collapse: collapse; font-size: 12px; border: 1px solid var(--border); border-radius: 6px; overflow: hidden;">
                            <thead>
                                <tr style="background: #F1F5F9; border-bottom: 2px solid var(--border);">
                                    <th style="padding: 9px 12px; color: var(--text-secondary); font-size: 11px; letter-spacing: 0.5px; text-align: left;">PART NO.</th>
                                    <th style="padding: 9px 12px; color: var(--text-secondary); font-size: 11px; letter-spacing: 0.5px; text-align: left;">VARIANT</th>
                                    <th style="padding: 9px 12px; color: var(--text-secondary); font-size: 11px; letter-spacing: 0.5px; text-align: center;">STOCK</th>
                                    <th style="padding: 9px 12px; color: var(--text-secondary); font-size: 11px; letter-spacing: 0.5px; text-align: right;">ORIG. PRICE</th>
                                    <th style="padding: 9px 12px; color: var(--text-secondary); font-size: 11px; letter-spacing: 0.5px; text-align: right;">RETAIL PRICE</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${variantProducts.map((v, idx) => {
                                    const sc = v.stock === 0 ? '#EF4444' : (v.stock <= (v.alertLimit||5) ? '#F59E0B' : '#22C55E');
                                    const sb = v.stock === 0 ? '#FEE2E2' : (v.stock <= (v.alertLimit||5) ? '#FEF3C7' : '#DCFCE7');
                                    return `
                                    <tr style="border-bottom:1px solid #F1F5F9; background:${idx%2===0?'#fff':'#F8FAFC'};">
                                        <td style="padding:10px 12px;font-weight:700;color:#1E293B;font-family:monospace;font-size:12px;">${v.partNo}</td>
                                        <td style="padding:10px 12px;color:#475569;font-weight:500;">${v.variantOptions}</td>
                                        <td style="padding:10px 12px;text-align:center;">
                                            <span style="background:${sb};color:${sc};padding:3px 10px;border-radius:9999px;font-weight:700;font-size:11px;">${v.stock}</span>
                                        </td>
                                        <td style="padding:10px 12px;text-align:right;font-weight:600;color:#334155;">₱${(v.price1||0).toLocaleString()}</td>
                                        <td style="padding:10px 12px;text-align:right;font-weight:700;color:var(--primary);">₱${(v.price2||0).toLocaleString()}</td>
                                    </tr>`;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            }

            document.getElementById('viewItemModalBody').innerHTML = `
                <div style="background:#EFF6FF;border:1px solid #BFDBFE;border-radius:8px;padding:18px;margin-bottom:4px;">
                    <div style="display:grid;grid-template-columns:repeat(3, 1fr);gap:16px 20px;">
                        <div style="display: flex; flex-direction: column; gap: 4px;">
                            <span style="color:#2563EB;font-size:12px;font-weight:600;text-transform: uppercase;letter-spacing:0.5px;">English Name</span>
                            <span style="font-weight:600;color:#1E293B;font-size:15px;min-height:20px;display:inline-block;">${base.name}</span>
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 4px;">
                            <span style="color:#2563EB;font-size:12px;font-weight:600;text-transform: uppercase;letter-spacing:0.5px;">Chinese Name</span>
                            <span style="font-weight:600;color:#1E293B;font-size:15px;min-height:20px;display:inline-block;">${base.chineseName || 'N/A'}</span>
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 4px;">
                            <span style="color:#2563EB;font-size:12px;font-weight:600;text-transform: uppercase;letter-spacing:0.5px;">Part No. (Base)</span>
                            <span style="font-weight:700;color:#1E293B;font-family:monospace;font-size:15px;min-height:20px;display:inline-block;">${base.partNo}</span>
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 4px;">
                            <span style="color:#2563EB;font-size:12px;font-weight:600;text-transform: uppercase;letter-spacing:0.5px;">Category</span>
                            <span style="font-weight:500;color:#334155;font-size:15px;min-height:20px;display:inline-block;">${base.category}</span>
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 4px;">
                            <span style="color:#2563EB;font-size:12px;font-weight:600;text-transform: uppercase;letter-spacing:0.5px;">Warehouse Location</span>
                            <span style="font-weight:500;color:#334155;font-size:15px;min-height:20px;display:inline-block;">${base.address || 'N/A'}</span>
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 4px;">
                            <span style="color:#2563EB;font-size:12px;font-weight:600;text-transform: uppercase;letter-spacing:0.5px;">Status</span>
                            <span style="font-weight:600;color:${base.status==='Active'?'#16A34A':'#EF4444'};font-size:15px;min-height:20px;display:inline-block;">${base.status || 'Active'}</span>
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 4px;">
                            <span style="color:#2563EB;font-size:12px;font-weight:600;text-transform: uppercase;letter-spacing:0.5px;">Stock Level</span>
                            <span style="font-weight:700;color:${base.stock===0?'#EF4444':base.stock<=(base.alertLimit||5)?'#F59E0B':'#1E293B'};font-size:15px;min-height:20px;display:inline-block;">${base.stock} units (Alert ≤ ${base.alertLimit||5})</span>
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 4px;">
                            <span style="color:#2563EB;font-size:12px;font-weight:600;text-transform: uppercase;letter-spacing:0.5px;">Sales Counter</span>
                            <span style="font-weight:500;color:#334155;font-size:15px;min-height:20px;display:inline-block;">${base.salesCount||0} units sold</span>
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 4px;">
                            <span style="color:#2563EB;font-size:12px;font-weight:600;text-transform: uppercase;letter-spacing:0.5px;">Original Price</span>
                            <span style="font-weight:700;color:#1E293B;font-size:15px;min-height:20px;display:inline-block;">₱${(base.price1||0).toLocaleString()}</span>
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 4px;">
                            <span style="color:#2563EB;font-size:12px;font-weight:600;text-transform: uppercase;letter-spacing:0.5px;">Retail Price</span>
                            <span style="font-weight:700;color:var(--primary);font-size:15px;min-height:20px;display:inline-block;">₱${(base.price2||0).toLocaleString()}</span>
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 4px;">
                            <span style="color:#2563EB;font-size:12px;font-weight:600;text-transform: uppercase;letter-spacing:0.5px;">Damaged / Scrap</span>
                            <span style="font-weight:500;color:${(base.damaged||0)>0?'#EF4444':'#334155'};font-size:15px;min-height:20px;display:inline-block;">${base.damaged||0} units</span>
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 4px;">
                            <span style="color:#2563EB;font-size:12px;font-weight:600;text-transform: uppercase;letter-spacing:0.5px;">Dead Stock</span>
                            <span style="font-weight:500;color:#334155;font-size:15px;min-height:20px;display:inline-block;">${base.isDeadStock?'Yes':'No'}</span>
                        </div>
                    </div>
                </div>
                ${variantsHtml}
            `;

            openModal('viewItemModal');
        }

        // Init loads
        loadCategories();
        renderInventoryTable();
    </script>
</body>
</html>
